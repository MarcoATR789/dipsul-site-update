<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Índice do catálogo - Dipsul</title>
  <link rel="stylesheet" href="../css/catalogo-impressao.css?v=20261110-2">
</head>
<body>
  <main class="catalogo-impressao">
    <section class="folha-apoio folha-indice" aria-label="Índice de categorias">
      <img class="folha-apoio-fundo" src="../img/catalogo/apoio/indice.png" alt="Índice do catálogo Dipsul">
      <ol class="indice-lista" data-lista="categorias">
        <li class="indice-linha">
          <span class="indice-categoria" data-campo="ct_descri">{{ct_descri}}</span>
          <span class="indice-pagina" data-campo="numero_pagina">{{numero_pagina}}</span>
        </li>
      </ol>
    </section>
  </main>
</body>
</html>
